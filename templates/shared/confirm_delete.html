{% extends "base.html" %}

{% block content %}
<section class="mx-auto w-full max-w-2xl rounded-3xl border border-rose-100 bg-white/95 p-6 shadow-lg shadow-rose-100/50 sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-rose-600">Atencion</p>
    <h2 class="mt-2 font-display text-2xl font-semibold text-slate-900">Confirmar eliminacion</h2>
    <p class="mt-3 text-sm text-slate-600">Esta accion no se puede deshacer.</p>
    <form method="post" class="mt-6">
        {% csrf_token %}
        <button class="inline-flex items-center rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-rose-700 focus:outline-none focus:ring-4 focus:ring-rose-100" type="submit">
            Eliminar
        </button>
    </form>
</section>
{% endblock %}
