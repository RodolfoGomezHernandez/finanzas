{% extends "base.html" %}

{% block content %}
<section class="mx-auto w-full max-w-3xl rounded-3xl border border-white/80 bg-white/90 p-6 shadow-lg shadow-slate-200/60 sm:p-8">
    <div class="mb-6 flex items-end justify-between gap-3">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-teal-700">{{ page_subtitle|default:"Gestion" }}</p>
            <h2 class="font-display text-2xl font-semibold text-slate-900">{{ page_title|default:"Formulario" }}</h2>
        </div>
    </div>
    <form method="post" class="form-shell">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="mt-4 inline-flex items-center rounded-xl bg-teal-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-teal-700 focus:outline-none focus:ring-4 focus:ring-teal-100" type="submit">
            Guardar
        </button>
    </form>
</section>
{% endblock %}
