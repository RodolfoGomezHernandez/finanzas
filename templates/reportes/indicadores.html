{% extends "base.html" %}

{% block content %}
<section class="rounded-3xl border border-white/80 bg-white/90 p-6 shadow-lg shadow-slate-200/60 sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky-700">Indicadores</p>
    <h2 class="mt-2 font-display text-3xl font-semibold text-slate-900">Configuracion KPI</h2>
    <p class="mt-3 text-sm text-slate-600">Define fecha de corte manual y porcentaje de ahorro para el calculo de gasto diario que se muestra en Inicio.</p>
</section>

<section class="mx-auto w-full max-w-4xl rounded-3xl border border-white/80 bg-white/90 p-6 shadow-lg shadow-slate-200/60 sm:p-8">
    <form method="post" class="form-shell">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="mt-4 inline-flex items-center rounded-xl bg-teal-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-teal-700" type="submit">
            Guardar configuracion
        </button>
    </form>
</section>
{% endblock %}
